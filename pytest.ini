[pytest]
markers =
    magicc: test requires (the correct version of) MAGICC to run.
    ciceroscm: test requires (the correct version of) CICERO-SCM to run.

# Mirrors the same setting in pyproject.toml. Needed here because
# pytest reads pytest.ini in preference to pyproject.toml when both
# exist, so pyproject's addopts are ignored. Without importlib mode,
# two test files with the same basename (e.g.
# tests/unit/adapters/test_fair2.py and tests/integration/test_fair2.py)
# collide during collection.
addopts = --import-mode=importlib
